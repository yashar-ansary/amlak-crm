    <script>
      // نادیده‌گیری خطاهای ناهمگام وب‌سوکت HMR در محیط پروکسی ابری AI Studio
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || (e.filename && e.filename.indexOf('@vite/client') !== -1))) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var str = String(e.reason || '');
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1) {
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
